apiVersion: apps/v1
kind: Deployment
metadata:
  name: manufacturers-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manufacturersservice
  template:
    metadata:
      labels:
        app: manufacturersservice
    spec:
      containers:
        - name: manufacturersservice
          image: lsvml/manufacturersservice:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_HOST
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
      
---
apiVersion: v1
kind: Service
metadata:
  name: manufacturers-clusterip-srv
spec:
  type: ClusterIP
  selector:
    app: manufacturersservice
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080